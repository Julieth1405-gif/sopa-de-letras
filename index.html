<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de Letras - Diplomado IA y Análisis de Datos</title>
    <style>
        :root {
            --primary: #1e3c72;
            --secondary: #2a5298;
            --accent: #00c6ff;
            --bg: #f4f7f6;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        .grid-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: grid;
            grid-template-columns: repeat(14, 35px);
            grid-template-rows: repeat(14, 35px);
            gap: 4px;
            user-select: none;
        }

        .cell {
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .cell.found {
            color: white;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.04); opacity: 1; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        }

        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 260px;
        }

        .sidebar h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        ul.word-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul.word-list li {
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8f5e9;
            border-left: 5px solid #ccc;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--secondary);
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(14, 26px);
                grid-template-rows: repeat(14, 26px);
                font-size: 12px;
            }
            .cell {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sopa de Letras - Diplomado IA</h1>
        <p>Visualización con diferenciación por colores y efectos visuales (Metodología CETO)</p>
    </header>

    <div class="main-container">
        <div class="grid-container" id="grid"></div>
        
        <div class="sidebar">
            <h3>Palabras Clave (10)</h3>
            <ul class="word-list" id="wordList"></ul>
            <div class="controls">
                <button onclick="resetGame()">Regenerar</button>
            </div>
        </div>
    </div>

    <script>
        const wordsData = [
            { word: "CONTEXTO", color: "#e74c3c" },
            { word: "EXPERTO", color: "#e67e22" },
            { word: "TAREA", color: "#d4ac0d" },
            { word: "SALIDA", color: "#27ae60" },
            { word: "INTELIGENCIA", color: "#16a085" },
            { word: "ARTIFICIAL", color: "#2980b9" },
            { word: "ANALISIS", color: "#8e44ad" },
            { word: "DATOS", color: "#d35400" },
            { word: "PROMPT", color: "#c0392b" },
            { word: "DIPLOMADO", color: "#2c3e50" }
        ];

        const GRID_SIZE = 14;
        let grid = [];
        let placedWords = [];

        function initGame() {
            createGridArray();
            placeWordsInGrid();
            fillRandomLetters();
            renderGrid();
            renderWordList();
            applyColorsOnLoad();
        }

        function createGridArray() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));
            placedWords = [];
        }

        function placeWordsInGrid() {
            const directions = [
                { r: 0, c: 1 },   // Horizontal derecha
                { r: 1, c: 0 },   // Vertical abajo
                { r: 1, c: 1 },   // Diagonal abajo-derecha
                { r: 0, c: -1 },  // Horizontal izquierda
                { r: -1, c: 0 },  // Vertical arriba
                { r: 1, c: -1 }   // Diagonal abajo-izquierda
            ];

            wordsData.forEach(item => {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 200) {
                    attempts++;
                    const dir = directions[Math.floor(Math.random() * directions.length)];
                    const startRow = Math.floor(Math.random() * GRID_SIZE);
                    const startCol = Math.floor(Math.random() * GRID_SIZE);

                    if (canPlaceWord(item.word, startRow, startCol, dir)) {
                        let wordCoords = [];
                        for (let i = 0; i < item.word.length; i++) {
                            const r = startRow + i * dir.r;
                            const c = startCol + i * dir.c;
                            grid[r][c] = item.word[i];
                            wordCoords.push({ r, c });
                        }
                        placedWords.push({ word: item.word, color: item.color, coords: wordCoords });
                        placed = true;
                    }
                }
            });
        }

        function canPlaceWord(word, row, col, dir) {
            for (let i = 0; i < word.length; i++) {
                const r = row + i * dir.r;
                const c = col + i * dir.c;
                if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) return false;
                if (grid[r][c] !== '' && grid[r][c] !== word[i]) return false;
            }
            return true;
        }

        function fillRandomLetters() {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                    }
                }
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.textContent = grid[r][c];
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderWordList() {
            const listEl = document.getElementById('wordList');
            listEl.innerHTML = '';
            wordsData.forEach(item => {
                const li = document.createElement('li');
                li.style.borderLeftColor = item.color;
                li.innerHTML = `<span>${item.word}</span>`;
                listEl.appendChild(li);
            });
        }

        function applyColorsOnLoad() {
            placedWords.forEach(pw => {
                pw.coords.forEach(coord => {
                    const cellEl = document.querySelector(`[data-row='${coord.r}'][data-col='${coord.c}']`);
                    if (cellEl) {
                        cellEl.classList.add('found');
                        cellEl.style.backgroundColor = pw.color;
                    }
                });
            });
        }

        function resetGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
